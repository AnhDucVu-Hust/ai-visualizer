# Nginx inside Docker Compose — mounts as /etc/nginx/conf.d/default.conf
#
# proxy_pass → service "app" on Compose network (not 127.0.0.1).
# Volume app_temp mounted at /app/temp in BOTH app and nginx containers.

upstream ai_visualizer_app {
    server app:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 3000m;

    # Shared volume app_temp → /app/temp (see docker-compose.yml)
    location /internal-temp/ {
        internal;
        alias /app/temp/;
    }

    location ~ ^/api/jobs/[^/]+/artifact$ {
        proxy_pass http://ai_visualizer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://ai_visualizer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
